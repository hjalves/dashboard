[project]
name = "dashboard"
version = "0.1.0"
description = "Metro-style always-on dashboard: clock, weather, news, GitHub, TV"
requires-python = ">=3.14"
dependencies = [
    "starlette>=0.50",
    "uvicorn>=0.38",
    "httpx>=0.28",
    "segno>=1.6.6",
    "icalendar>=7.3.2",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
dashboard = "dashboard.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/**/*"]
