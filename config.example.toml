# ~/.config/dashboard/config.toml — every key is optional; these are the defaults.

[listen]
host = "0.0.0.0"
port = 8001

[weather]
# Forecast: "metno" (MET Norway, hourly rain in mm) or "ipma" (rain probability)
source = "metno"
place = "Proença-a-Nova"
latitude = 39.7495
longitude = -7.9229
# For source = "ipma":
# IPMA globalIdLocal: https://api.ipma.pt/public-data/forecast/locations.json (1050800 = Proença-a-Nova, 1110600 = Lisboa)
ipma_location = 1050800
hours = 30
# weatherd on the router (anonymous ubus read); "" to hide the station
station_ubus = "http://192.168.0.254/ubus"

[network]
# The router's ubus endpoint (lanwatch, huawei-trafficd; anonymous read)
router_ubus = "http://192.168.0.254/ubus"

[calendar]
days = 14            # how far ahead the agenda tile looks
# One table per calendar. Google Calendar: Settings → the calendar → "Secret address in iCal
# format". That address is a secret (anyone with it can read the calendar): keep it only in
# your own config.toml, never in the repo.
# [[calendar.calendars]]
# name = "Main"
# url = "https://calendar.google.com/calendar/ical/…/private-…/basic.ics"
# color = "#e3008c"

[news]
# Names from https://news.kagi.com/kite.json
categories = ["Portugal", "World", "Europe", "Business", "Technology", "Linux & OSS"]
per_category = 12

[github]
# Your most recently pushed repos (token: $GITHUB_TOKEN, else `gh auth token`)
repos = 8
commits = 3

[tv]
playlist = "https://m3upt.com/iptv"
epg = "https://m3upt.com/epg"
channel = "RTP Notícias"            # default; right-click the TV tile to switch
channels = ["RTP Notícias", "SIC Notícias", "CNN Portugal", "Euronews PT"]
